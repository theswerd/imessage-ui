name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

# imessage.swerdlow.dev is served by Vercel, which deploys it from this repo on every push to main
# through its own GitHub integration - there is no job for it here. This workflow is the second
# target: the same commit on Cloudflare Workers at its workers.dev hostname. It only runs once
# CLOUDFLARE_API_TOKEN exists, so the repo is not red while that secret is missing.
jobs:
  deploy:
    name: Build and deploy to Cloudflare
    runs-on: ubuntu-latest
    if: vars.CLOUDFLARE_ENABLED == 'true'
    environment:
      name: cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      # The registry's JSON and per-component agent docs are generated, and the build script fails if
      # a declared registryDependency does not match the file's real imports. Running it here means a
      # drifted manifest breaks the deploy rather than shipping a registry consumers cannot install.
      - run: bun run registry:build
        env:
          REGISTRY_URL: https://imessage.swerdlow.dev
      - run: bun run typecheck
      - run: bun run lint
      - run: bun test tests/unit
      - name: Deploy
        run: bunx opennextjs-cloudflare build && bunx opennextjs-cloudflare deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          REGISTRY_URL: https://imessage.swerdlow.dev
