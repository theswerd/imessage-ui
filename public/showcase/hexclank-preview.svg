      <path d="M 11 16.87 L 14 15.13 L 14 32.87 L 11 31.13 Z" fill="url(#neon-grad)" transform="rotate(240 24 24)" />
    </g>
  </defs>
  <use href="#benzene-mark" filter="url(#glow)" opacity="0.75" />
